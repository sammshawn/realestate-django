{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Prime Properties Kenya{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{% url 'listings:home' %}" class="logo">🏠 Prime Properties</a>
            <ul class="nav-links">
                <li><a href="{% url 'listings:home' %}">Home</a></li>
                <li><a href="{% url 'listings:property_list' %}">Properties</a></li>
                <li><a href="/admin/" target="_blank">Admin</a></li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Prime Properties Kenya. All rights reserved.</p>
            <p>Nairobi • Mombasa • Kisumu • Nakuru</p>
        </div>
    </footer>
</body>
</html>
